name: Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install

      - name: Tip kontrolü + soru bankası doğrulama + web derleme
        run: npm run build

      - name: Android projesini oluştur
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: İkon ve açılış ekranı
        run: npx capacitor-assets generate --android --iconBackgroundColor '#070B14' --iconBackgroundColorDark '#070B14' --splashBackgroundColor '#070B14' --splashBackgroundColorDark '#070B14'

      - name: Senkronize et
        run: npx cap sync android

      - name: Android izinleri ve bildirim ikonu
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/android/ic_stat_belgecep.xml android/app/src/main/res/drawable/
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          fi
          if ! grep -q "com.android.vending.BILLING" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="com.android.vending.BILLING" />\n</manifest>#' "$MANIFEST"
          fi
          # Android 11+: sesli okuma (TTS) motorunu bulabilmek için
          if ! grep -q "TTS_SERVICE" "$MANIFEST"; then
            sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n</manifest>#' "$MANIFEST"
          fi
          grep -n "POST_NOTIFICATIONS\|vending.BILLING\|TTS_SERVICE" "$MANIFEST"

      - name: Sürüm numarası
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: AAB derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: AAB imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" belgecep-ogg-${{ github.run_number }}.aab
          rm -f upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: belgecep-ogg-aab-${{ github.run_number }}
          path: belgecep-ogg-${{ github.run_number }}.aab
